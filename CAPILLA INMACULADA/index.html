<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Capilla Virtual - Inmaculada Concepción</title>

    <meta name="theme-color" content="#123c78">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

</head>

<body>

<div class="background"></div>

<header>

    <h1>Capilla Virtual</h1>

    <h2>Inmaculada Concepción</h2>

</header>

<main>

    <!-- ===================== -->
    <!-- CARRUSEL -->
    <!-- ===================== -->

    <section class="card">

        <div class="carousel">

            <button id="prev" class="arrow">
                &#10094;
            </button>

            <img
                id="virgen"
                src="assets/imagenes/1.jpg"
                alt="Inmaculada Concepción">

            <button id="next" class="arrow">
                &#10095;
            </button>

        </div>

        <div id="dots" class="dots"></div>

    </section>


    <!-- ===================== -->
    <!-- VELA -->
    <!-- ===================== -->

    <section class="card">

        <h3>🕯️ Encender una vela</h3>

        <textarea
            id="peticion"
            placeholder="Escribe aquí tu petición, oración o agradecimiento..."></textarea>

        <button id="encender">

            Encender vela

        </button>

    </section>


    <!-- ===================== -->
    <!-- GALERÍA DE VELAS -->
    <!-- ===================== -->

    <section class="card">

        <h3>Velas encendidas</h3>

        <div id="velas">

        </div>

    </section>


    <!-- ===================== -->
    <!-- ORACIONES -->
    <!-- ===================== -->

    <section class="card">

        <h3>🙏 Oraciones</h3>

        <div class="oraciones">

            <button class="oracion" data-oracion="avemaria">
                Ave María
            </button>

            <button class="oracion" data-oracion="salve">
                Salve
            </button>

            <button class="oracion" data-oracion="angelus">
                Ángelus
            </button>

            <button class="oracion" data-oracion="magnificat">
                Magnificat
            </button>

            <button class="oracion" data-oracion="consagracion">
                Consagración
            </button>

        </div>

        <div id="textoOracion">

            Selecciona una oración.

        </div>

    </section>


    <!-- ===================== -->
    <!-- MÚSICA -->
    <!-- ===================== -->

    <section class="card">

        <h3>🎵 Música</h3>

        <button id="musica">

            Reproducir música

        </button>

        <audio id="audio" loop>

            <source src="assets/musica/maria.mp3" type="audio/mpeg">

        </audio>

    </section>

</main>

<footer>

    <p>

        Bajo tu amparo nos acogemos,
        Santa Madre de Dios.

    </p>

</footer>

<script src="app.js"></script>

</body>

</html>
